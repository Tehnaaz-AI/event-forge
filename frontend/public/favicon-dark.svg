<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Dark Luxury Obsidian Background -->
    <radialGradient id="darkBg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1C1917" />
      <stop offset="60%" stop-color="#0E0C0A" />
      <stop offset="100%" stop-color="#050505" />
    </radialGradient>

    <!-- Vibrant Molten Gold Gradient -->
    <linearGradient id="darkGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="25%" stop-color="#FDE68A" />
      <stop offset="55%" stop-color="#F59E0B" />
      <stop offset="85%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <!-- Outer Rim Metallic Stroke -->
    <linearGradient id="darkRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#B45309" stop-opacity="0.3" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="darkDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#F59E0B" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Luxury Squircle Container -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#darkBg)" stroke="url(#darkRim)" stroke-width="2.5" />

  <!-- Ambient Glow -->
  <circle cx="64" cy="64" r="40" fill="#F59E0B" fill-opacity="0.08" />

  <!-- EVENT MANAGEMENT ICON (DARK MODE): Conference Calendar & VIP Ticket Pass with Stage Star -->
  <g filter="url(#darkDrop)">
    <!-- Calendar / Pass Card Body -->
    <rect x="26" y="32" width="76" height="72" rx="16" fill="#181512" stroke="url(#darkGold)" stroke-width="3" />

    <!-- Calendar Top Header Banner Bar -->
    <path d="M28 44C28 36.268 34.268 34 42 34H86C93.732 34 100 36.268 100 44V50H28V44Z" fill="url(#darkGold)" />

    <!-- Calendar Binder Clips / Lanyard Rings -->
    <rect x="42" y="22" width="8" height="18" rx="4" fill="#FFFBEB" stroke="#92400E" stroke-width="2" />
    <rect x="78" y="22" width="8" height="18" rx="4" fill="#FFFBEB" stroke="#92400E" stroke-width="2" />

    <!-- Ticket Notch Cutouts (Left & Right) -->
    <circle cx="26" cy="74" r="6" fill="#0E0C0A" stroke="url(#darkGold)" stroke-width="2.5" />
    <circle cx="102" cy="74" r="6" fill="#0E0C0A" stroke="url(#darkGold)" stroke-width="2.5" />

    <!-- Event Ticket Perforation Line -->
    <line x1="36" y1="74" x2="92" y2="74" stroke="#F59E0B" stroke-dasharray="3 3" stroke-width="1.5" stroke-opacity="0.6" />

    <!-- Calendar Schedule Matrix Dots (3 Grid Points) -->
    <circle cx="44" cy="60" r="3" fill="#FDE68A" />
    <circle cx="64" cy="60" r="3" fill="#FDE68A" />
    <circle cx="84" cy="60" r="3" fill="#FDE68A" />

    <!-- VIP Keynote Live Stage Star / Spark Indicator (Bottom Center) -->
    <path d="M64 80L66.5 86.5L73 89L66.5 91.5L64 98L61.5 91.5L55 89L61.5 86.5L64 80Z" fill="#FFFFFF" />
    <circle cx="64" cy="89" r="2.5" fill="#FFFBEB" />
  </g>
</svg>
