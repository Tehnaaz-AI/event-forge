<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Dark Luxury Obsidian Squircle Background -->
    <radialGradient id="darkBg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1C1A17" />
      <stop offset="60%" stop-color="#0F0E0C" />
      <stop offset="100%" stop-color="#060504" />
    </radialGradient>

    <!-- Luxury Warm Beige & Champagne Gradient -->
    <linearGradient id="darkBeige" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF6EF" />
      <stop offset="25%" stop-color="#F2E8D5" />
      <stop offset="55%" stop-color="#E5D6BD" />
      <stop offset="85%" stop-color="#CBB799" />
      <stop offset="100%" stop-color="#AD9574" />
    </linearGradient>

    <!-- Warm Beige Metallic Rim Stroke -->
    <linearGradient id="darkBeigeRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF6EF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#DFCDB2" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#AD9574" stop-opacity="0.4" />
    </linearGradient>

    <!-- Subtle Soft Beige Glow Filter -->
    <filter id="darkDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#DFCDB2" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Luxury Squircle Base -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#darkBg)" stroke="url(#darkBeigeRim)" stroke-width="2.5" />

  <!-- Ambient Soft Beige Glow -->
  <circle cx="64" cy="64" r="40" fill="#E5D6BD" fill-opacity="0.06" />

  <!-- EVENT MANAGEMENT ICON (DARK MODE - WARM BEIGE): Conference Calendar & VIP Ticket Pass -->
  <g filter="url(#darkDrop)">
    <!-- Calendar / Pass Card Body -->
    <rect x="26" y="32" width="76" height="72" rx="16" fill="#151310" stroke="url(#darkBeige)" stroke-width="3" />

    <!-- Calendar Top Header Banner Bar (Warm Beige Gradient) -->
    <path d="M28 44C28 36.268 34.268 34 42 34H86C93.732 34 100 36.268 100 44V50H28V44Z" fill="url(#darkBeige)" />

    <!-- Calendar Binder Clips / Lanyard Rings (Crisp Light Cream) -->
    <rect x="42" y="22" width="8" height="18" rx="4" fill="#FFFDF9" stroke="#7A664E" stroke-width="2" />
    <rect x="78" y="22" width="8" height="18" rx="4" fill="#FFFDF9" stroke="#7A664E" stroke-width="2" />

    <!-- Ticket Notch Cutouts (Left & Right) -->
    <circle cx="26" cy="74" r="6" fill="#0C0B0A" stroke="url(#darkBeige)" stroke-width="2.5" />
    <circle cx="102" cy="74" r="6" fill="#0E0C0A" stroke="url(#darkBeige)" stroke-width="2.5" />

    <!-- Event Ticket Perforation Line -->
    <line x1="36" y1="74" x2="92" y2="74" stroke="#E5D6BD" stroke-dasharray="3 3" stroke-width="1.5" stroke-opacity="0.5" />

    <!-- Calendar Schedule Matrix Dots (3 Beige Dots) -->
    <circle cx="44" cy="60" r="3" fill="#FAF6EF" />
    <circle cx="64" cy="60" r="3" fill="#FAF6EF" />
    <circle cx="84" cy="60" r="3" fill="#FAF6EF" />

    <!-- VIP Keynote Live Stage Star / Spark Indicator (Warm Beige Spark) -->
    <path d="M64 80L66.5 86.5L73 89L66.5 91.5L64 98L61.5 91.5L55 89L61.5 86.5L64 80Z" fill="#FFFDF9" />
    <circle cx="64" cy="89" r="2.5" fill="#E5D6BD" />
  </g>
</svg>
