<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Light Luxury Warm Champagne / Cream Squircle Background -->
    <radialGradient id="lightBg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FDF8F0" />
      <stop offset="100%" stop-color="#EFE6D6" />
    </radialGradient>

    <!-- Deep Burnished Bronze-Amber Gradient for Light Mode -->
    <linearGradient id="lightAmberHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="40%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- Gold Accent Stroke -->
    <linearGradient id="lightGoldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- Light Squircle Border -->
    <linearGradient id="lightRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#B45309" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#78350F" stop-opacity="0.7" />
    </linearGradient>

    <!-- Crisp Soft Shadow -->
    <filter id="lightDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#78350F" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Luxury Light Squircle Base -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#lightBg)" stroke="url(#lightRim)" stroke-width="2.5" />

  <!-- EVENT MANAGEMENT ICON (LIGHT MODE): Executive Calendar & Ticket Pass with Golden Star -->
  <g filter="url(#lightDrop)">
    <!-- Calendar Body (Clean Crisp White/Ivory Card with Amber Border) -->
    <rect x="26" y="32" width="76" height="72" rx="16" fill="#FFFFFF" stroke="url(#lightGoldStroke)" stroke-width="3" />

    <!-- Calendar Top Header Banner Bar (Rich Amber Bronze) -->
    <path d="M28 44C28 36.268 34.268 34 42 34H86C93.732 34 100 36.268 100 44V50H28V44Z" fill="url(#lightAmberHeader)" />

    <!-- Calendar Binder Clips / Lanyard Rings -->
    <rect x="42" y="22" width="8" height="18" rx="4" fill="#FEF3C7" stroke="#78350F" stroke-width="2" />
    <rect x="78" y="22" width="8" height="18" rx="4" fill="#FEF3C7" stroke="#78350F" stroke-width="2" />

    <!-- Ticket Notch Cutouts (Left & Right) -->
    <circle cx="26" cy="74" r="6" fill="#EFE6D6" stroke="url(#lightGoldStroke)" stroke-width="2.5" />
    <circle cx="102" cy="74" r="6" fill="#EFE6D6" stroke="url(#lightGoldStroke)" stroke-width="2.5" />

    <!-- Event Ticket Perforation Line -->
    <line x1="36" y1="74" x2="92" y2="74" stroke="#B45309" stroke-dasharray="3 3" stroke-width="1.5" stroke-opacity="0.5" />

    <!-- Calendar Schedule Matrix Dots -->
    <circle cx="44" cy="60" r="3.5" fill="#B45309" />
    <circle cx="64" cy="60" r="3.5" fill="#B45309" />
    <circle cx="84" cy="60" r="3.5" fill="#B45309" />

    <!-- Keynote Stage Star / Forge Spark (Molten Gold Glow on White) -->
    <path d="M64 80L66.5 86.5L73 89L66.5 91.5L64 98L61.5 91.5L55 89L61.5 86.5L64 80Z" fill="url(#lightAmberHeader)" />
    <circle cx="64" cy="89" r="2.5" fill="#FDE68A" />
  </g>
</svg>
