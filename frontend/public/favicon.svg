<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Rich Obsidian Background Gradient -->
    <radialGradient id="efBgGrad" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1C1917" />
      <stop offset="60%" stop-color="#0F0D0B" />
      <stop offset="100%" stop-color="#050506" />
    </radialGradient>

    <!-- Luxury Molten Amber-Gold Gradient -->
    <linearGradient id="efGoldCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="25%" stop-color="#FCD34D" />
      <stop offset="55%" stop-color="#F59E0B" />
      <stop offset="85%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <!-- Warm Amber Wing / Facet Gradient -->
    <linearGradient id="efGoldAccent" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="80%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- Outer Rim Metallic Stroke -->
    <linearGradient id="efRimStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#F59E0B" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#B45309" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.8" />
    </linearGradient>

    <!-- Ambient Core Glow -->
    <radialGradient id="efCentralGlow" cx="50%" cy="52%" r="48%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#B45309" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#B45309" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Glow Filter for crispness -->
    <filter id="efGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#F59E0B" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Dark Luxury Rounded Squircle Base -->
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#efBgGrad)" stroke="url(#efRimStroke)" stroke-width="2.5" />

  <!-- Center Ambient Radial Halo -->
  <circle cx="64" cy="64" r="42" fill="url(#efCentralGlow)" />

  <!-- EventForge Signature Monogram Crest / Forge Flame & Spark -->
  <g filter="url(#efGlow)">
    <!-- Left Dynamic Forge Wing (Stylized 'E' Ascent) -->
    <path d="M40 32C40 32 58 48 58 66C58 78 48 86 38 88C33 89 31 82 34 78C39 71 44 63 43 53C42 43 36 37 40 32Z" fill="url(#efGoldAccent)" />

    <!-- Right Soaring Forge Flame (Stylized 'F' Blade) -->
    <path d="M64 20C68 32 82 46 86 58C91 72 84 88 68 96C61 100 58 93 63 88C71 80 74 69 70 58C67 47 59 36 64 20Z" fill="url(#efGoldCore)" />

    <!-- Central Interlocking Forge Ember Diamond -->
    <path d="M64 42L76 64L64 86L52 64L64 42Z" fill="url(#efGoldCore)" stroke="#FFFBEB" stroke-width="1.5" stroke-linejoin="round" />

    <!-- Core Brilliant Star Spark -->
    <path d="M64 52L67 61L76 64L67 67L64 76L61 67L52 64L61 61L64 52Z" fill="#FFFFFF" />
    <circle cx="64" cy="64" r="3" fill="#FFFBEB" />
  </g>

  <!-- Bottom Crisp Base Bar -->
  <rect x="42" y="102" width="44" height="4" rx="2" fill="url(#efGoldCore)" opacity="0.9" />
</svg>
