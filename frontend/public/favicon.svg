<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- LIGHT MODE STYLES & GRADIENTS -->
    <radialGradient id="lightBg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FDF8F0" />
      <stop offset="100%" stop-color="#EFE6D6" />
    </radialGradient>
    <linearGradient id="lightAmberHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="40%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <linearGradient id="lightGoldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <linearGradient id="lightRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#B45309" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#78350F" stop-opacity="0.7" />
    </linearGradient>

    <!-- DARK MODE STYLES & GRADIENTS (WARM BEIGE / CHAMPAGNE) -->
    <radialGradient id="darkBg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1C1A17" />
      <stop offset="60%" stop-color="#0F0E0C" />
      <stop offset="100%" stop-color="#060504" />
    </radialGradient>
    <linearGradient id="darkBeige" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF6EF" />
      <stop offset="25%" stop-color="#F2E8D5" />
      <stop offset="55%" stop-color="#E5D6BD" />
      <stop offset="85%" stop-color="#CBB799" />
      <stop offset="100%" stop-color="#AD9574" />
    </linearGradient>
    <linearGradient id="darkBeigeRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF6EF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#DFCDB2" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#AD9574" stop-opacity="0.4" />
    </linearGradient>

    <style>
      .theme-dark { display: none; }
      .theme-light { display: block; }
      @media (prefers-color-scheme: dark) {
        .theme-dark { display: block; }
        .theme-light { display: none; }
      }
    </style>
  </defs>

  <!-- LIGHT THEME FAVICON LAYER -->
  <g class="theme-light">
    <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#lightBg)" stroke="url(#lightRim)" stroke-width="2.5" />
    <rect x="26" y="32" width="76" height="72" rx="16" fill="#FFFFFF" stroke="url(#lightGoldStroke)" stroke-width="3" />
    <path d="M28 44C28 36.268 34.268 34 42 34H86C93.732 34 100 36.268 100 44V50H28V44Z" fill="url(#lightAmberHeader)" />
    <rect x="42" y="22" width="8" height="18" rx="4" fill="#FEF3C7" stroke="#78350F" stroke-width="2" />
    <rect x="78" y="22" width="8" height="18" rx="4" fill="#FEF3C7" stroke="#78350F" stroke-width="2" />
    <circle cx="26" cy="74" r="6" fill="#EFE6D6" stroke="url(#lightGoldStroke)" stroke-width="2.5" />
    <circle cx="102" cy="74" r="6" fill="#EFE6D6" stroke="url(#lightGoldStroke)" stroke-width="2.5" />
    <line x1="36" y1="74" x2="92" y2="74" stroke="#B45309" stroke-dasharray="3 3" stroke-width="1.5" stroke-opacity="0.5" />
    <circle cx="44" cy="60" r="3.5" fill="#B45309" />
    <circle cx="64" cy="60" r="3.5" fill="#B45309" />
    <circle cx="84" cy="60" r="3.5" fill="#B45309" />
    <path d="M64 80L66.5 86.5L73 89L66.5 91.5L64 98L61.5 91.5L55 89L61.5 86.5L64 80Z" fill="url(#lightAmberHeader)" />
    <circle cx="64" cy="89" r="2.5" fill="#FDE68A" />
  </g>

  <!-- DARK THEME FAVICON LAYER (WARM BEIGE) -->
  <g class="theme-dark">
    <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#darkBg)" stroke="url(#darkBeigeRim)" stroke-width="2.5" />
    <circle cx="64" cy="64" r="40" fill="#E5D6BD" fill-opacity="0.06" />
    <rect x="26" y="32" width="76" height="72" rx="16" fill="#151310" stroke="url(#darkBeige)" stroke-width="3" />
    <path d="M28 44C28 36.268 34.268 34 42 34H86C93.732 34 100 36.268 100 44V50H28V44Z" fill="url(#darkBeige)" />
    <rect x="42" y="22" width="8" height="18" rx="4" fill="#FFFDF9" stroke="#7A664E" stroke-width="2" />
    <rect x="78" y="22" width="8" height="18" rx="4" fill="#FFFDF9" stroke="#7A664E" stroke-width="2" />
    <circle cx="26" cy="74" r="6" fill="#0C0B0A" stroke="url(#darkBeige)" stroke-width="2.5" />
    <circle cx="102" cy="74" r="6" fill="#0E0C0A" stroke="url(#darkBeige)" stroke-width="2.5" />
    <line x1="36" y1="74" x2="92" y2="74" stroke="#E5D6BD" stroke-dasharray="3 3" stroke-width="1.5" stroke-opacity="0.5" />
    <circle cx="44" cy="60" r="3" fill="#FAF6EF" />
    <circle cx="64" cy="60" r="3" fill="#FAF6EF" />
    <circle cx="84" cy="60" r="3" fill="#FAF6EF" />
    <path d="M64 80L66.5 86.5L73 89L66.5 91.5L64 98L61.5 91.5L55 89L61.5 86.5L64 80Z" fill="#FFFDF9" />
    <circle cx="64" cy="89" r="2.5" fill="#E5D6BD" />
  </g>
</svg>
